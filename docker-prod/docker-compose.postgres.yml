# Production build of qui backed by Postgres.
#
#   docker compose -f docker-prod/docker-compose.postgres.yml up -d --build
name: qui-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: qui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qui
      POSTGRES_PASSWORD: qui
      POSTGRES_DB: qui
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qui:
    image: ghcr.io/gjhuerte/qui:${QUI_TAG:-latest}
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    container_name: qui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7476:7476"
    volumes:
      # Named volumes, so Docker never creates root-owned data in the repo.
      - qui-config:/config
    environment:
      QUI__DATABASE_ENGINE: postgres
      QUI__DATABASE_DSN: postgres://qui:qui@postgres:5432/qui?sslmode=disable

volumes:
  qui-config:
  postgres-data:
