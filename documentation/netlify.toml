[build]
  publish = "build"
  command = "pnpm --dir ../web install --frozen-lockfile && pnpm --dir ../web build:demo && rm -rf static/demo && cp -r ../web/dist-demo static/demo && pnpm build"

[build.environment]
  NODE_VERSION = "24"

# The demo is the qui SPA under /demo/; a reload on a deep link needs the shell.
[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200
